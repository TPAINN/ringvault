animation-delay:-1.53s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="1060" y="169.05855467780816" width="5" height="12" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-1.62s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="1070" y="151.25204665849517" width="5" height="47" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-1.71s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="1080" y="142.26299404054362" width="5" height="65" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-1.80s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="1090" y="146.31908872799784" width="5" height="57" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-1.89s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="1100" y="161.51268601112028" width="5" height="27" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-1.98s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="1110" y="159.30200031884783" width="5" height="31" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-2.07s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="1120" y="145.14812305971793" width="5" height="60" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-2.16s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="1130" y="142.6824718468916" width="5" height="65" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-2.25s;transform-origin:center;transform-box:fill-box"/></g>
<text x="72" y="140" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#tt)">RingVault</text>
