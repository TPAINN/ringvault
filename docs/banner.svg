<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="RingVault — Free ringtones, notifications &amp; alarms for Android. CC0. No ads.">
<title>RingVault</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161006"/><stop offset="1" stop-color="#06121a"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#fbbf24" stop-opacity=".55"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="clip"><rect width="1280" height="360" rx="22"/></clipPath>
<style>
.bar{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.4s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.3);opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 4s ease-out infinite}
@keyframes rg{0%{transform:scale(.75);opacity:.6}100%{transform:scale(1.15);opacity:0}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.glow{filter:drop-shadow(0 0 8px #fbbf24)}
.blink{animation:bk 1.1s steps(2,start) infinite}
@keyframes bk{to{opacity:0}}
.sweep{animation:sw 3.4s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translateY(0)}50%{transform:translateY(272px)}}
.cell{animation:ce 3.2s ease-in-out infinite}
@keyframes ce{0%,100%{opacity:.25}50%{opacity:1}}
.scramble{animation:sc 3s ease-in-out infinite}
@keyframes sc{0%,100%{opacity:.15}30%,70%{opacity:1}}
.seg{transform-box:fill-box;transform-origin:left;animation:sg 3s ease-in-out infinite}
@keyframes sg{0%,100%{transform:scaleX(.2);opacity:.4}50%{transform:scaleX(1);opacity:1}}
.flip{transform-box:fill-box;transform-origin:center;animation:fp 5s ease-in-out infinite}
@keyframes fp{0%,40%,100%{transform:scaleX(1)}50%{transform:scaleX(.05)}60%,90%{transform:scaleX(1)}}
.ringbell{transform-box:fill-box;transform-origin:50% 8%;animation:rb 2.4s ease-in-out infinite}
@keyframes rb{0%,100%{transform:rotate(0)}15%{transform:rotate(9deg)}30%{transform:rotate(-9deg)}45%{transform:rotate(5deg)}60%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="360" fill="url(#bg)"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<circle cx="260" cy="40" r="260" fill="url(#orb)"><animate attributeName="cx" values="260;340;260" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="340" r="300" fill="url(#orb2)"><animate attributeName="cy" values="340;290;340" dur="11s" repeatCount="indefinite"/></circle>
<circle class="ring" cx="1010" cy="175" r="74" fill="none" stroke="#fbbf24" stroke-width="2" style="animation-delay:-0.9s"/><circle class="ring" cx="1010" cy="175" r="108" fill="none" stroke="#38bdf8" stroke-width="2" style="animation-delay:-1.8s"/><circle class="ring" cx="1010" cy="175" r="142" fill="none" stroke="#fbbf24" stroke-width="2" style="animation-delay:-2.7s"/><circle class="ring" cx="1010" cy="175" r="176" fill="none" stroke="#38bdf8" stroke-width="2" style="animation-delay:-3.6s"/><g class="ringbell"><path d="M1010 120c-26 0-44 20-44 46v28l-16 22h120l-16-22v-28c0-26-18-46-44-46z" fill="url(#g1)"/><circle cx="1010" cy="226" r="11" fill="#fbbf24"/></g><g transform="translate(0 100)"><rect class="bar" x="880" y="170" width="5" height="10" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-0.00s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="890" y="151.96190475734466" width="5" height="46" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-0.09s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="900" y="142.40740756032312" width="5" height="65" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-0.18s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="910" y="145.83013773383152" width="5" height="58" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-0.27s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="920" y="160.62033179563466" width="5" height="29" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-0.36s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="930" y="160.17806962469064" width="5" height="30" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-0.45s;transform-origin:center;transform-box:fill-box"/><rect class="bar" x="940" y="145.59587837241955" width="5" height="59" rx="2.5" fill="#fbbf24" opacity=".85" style="animation-delay:-0.54s;transform-origin:center;transform-box:fill-bo