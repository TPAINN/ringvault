name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            https://ringvault-api-0wbw.onrender.com/health || echo "000")
          echo "health -> $code"
          # Allow 200 OK, 503 cold-start, or any 2xx; never fail the workflow
          case "$code" in
            2*|503) echo "OK" ;;
            *)      echo "Non-critical: $code — server may be cold-starting" ;;
          esac